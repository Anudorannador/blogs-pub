<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
      
      .bg { fill: #ffffff; }
      
      /* Regions */
      .region-asset { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 2; rx: 8; }
      .region-liab { fill: #fef2f2; stroke: #fecaca; stroke-width: 2; rx: 8; }
      .region-label { font-size: 14px; font-weight: bold; font-family: 'Inter', sans-serif; text-anchor: middle; }
      .label-asset { fill: #15803d; }
      .label-liab { fill: #b91c1c; }
      
      /* Lots */
      .lot-usdc { fill: #d1fae5; stroke: #059669; stroke-width: 2; rx: 6; }
      .lot-btc-debt { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; stroke-dasharray: 4; rx: 6; }
      
      .text-qty { font-family: 'Inter', sans-serif; font-weight: bold; font-size: 16px; }
      .text-usdc { fill: #065f46; }
      .text-btc { fill: #991b1b; }
      
      .text-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.9; }
      
      /* Steps */
      .step-title { font-size: 18px; font-weight: bold; fill: #1e293b; font-family: 'Inter', sans-serif; }
      .step-desc { font-size: 14px; fill: #64748b; font-family: 'Inter', sans-serif; }
      
      /* Calc Box */
      .calc-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.05)); }
      .calc-title { font-size: 12px; font-weight: bold; fill: #64748b; font-family: 'Inter', sans-serif; }
      .calc-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #334155; }
      .val-pos { fill: #166534; font-weight: bold; }
      
      /* Connectors */
      .conn-line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4; }
    </style>
    <marker id="arrowHeadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15803d" />
    </marker>
    <marker id="arrowHeadRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b91c1c" />
    </marker>
  </defs>

  <rect width="1000" height="600" class="bg" />

  <!-- Main Headers -->
  <text x="50" y="40" font-size="22" font-weight="bold" font-family="sans-serif" fill="#0f172a">Spot Short Logic: Negative Inventory</text>

  <!-- ASSET COLUMN -->
  <rect x="50" y="70" width="420" height="500" class="region-asset" />
  <text x="260" y="100" class="region-label label-asset">ASSETS (Inventory)</text>

  <!-- LIABILITY COLUMN -->
  <rect x="530" y="70" width="420" height="500" class="region-liab" />
  <text x="740" y="100" class="region-label label-liab">LIABILITIES (Debt)</text>

  <!-- ===========================
       STEP 1: OPEN SHORT
       =========================== -->
  <g transform="translate(0, 140)">
    <text x="500" y="0" text-anchor="middle" class="step-title">1. Open Short (Sell 1 BTC @ 50k USDT)</text>
    <text x="500" y="20" text-anchor="middle" class="step-desc">Receive USDT, Create BTC Debt. Values match.</text>
    
    <!-- Left: Receive USDT -->
    <g transform="translate(150, 40)">
      <rect width="220" height="60" class="lot-usdc" />
      <text x="110" y="25" text-anchor="middle" class="text-qty text-usdc">+50,000 USDT</text>
      <text x="110" y="45" text-anchor="middle" class="text-val text-usdc">Basis: 50,000 USDT</text>
    </g>
    
    <!-- Right: Create Debt -->
    <g transform="translate(630, 40)">
      <rect width="220" height="60" class="lot-btc-debt" />
      <text x="110" y="25" text-anchor="middle" class="text-qty text-btc">-1.0 BTC (Owed)</text>
      <text x="110" y="45" text-anchor="middle" class="text-val text-btc">Open Value: 50,000 USDT</text>
    </g>
    
    <!-- Equality Indicator -->
    <line x1="380" y1="70" x2="620" y2="70" class="conn-line" />
    <circle cx="500" cy="70" r="15" fill="#fff" stroke="#94a3b8" stroke-width="2" />
    <text x="500" y="75" text-anchor="middle" font-weight="bold" font-size="14" fill="#64748b">=</text>
  </g>

  <!-- ===========================
       STEP 2: CLOSE SHORT
       =========================== -->
  <g transform="translate(0, 350)">
    <text x="500" y="0" text-anchor="middle" class="step-title">2. Close Short (Buy 1 BTC @ 40k USDT)</text>
    <text x="500" y="20" text-anchor="middle" class="step-desc">Spend USDT to Cover Debt. Difference is Profit.</text>
    
    <!-- Left: Spend USDT (Disposal) -->
    <g transform="translate(150, 40)">
      <path d="M 110 0 L 110 -30" stroke="#15803d" stroke-width="2" marker-end="url(#arrowHeadGreen)" />
      
      <rect width="220" height="60" class="lot-usdc" fill="#fff" stroke-dasharray="4" />
      <text x="110" y="25" text-anchor="middle" class="text-qty text-usdc">Spend 40,000 USDT</text>
      <text x="110" y="45" text-anchor="middle" class="text-val text-usdc">Basis used: 40,000 USDT</text>
      
      <!-- Tiny PnL Note -->
      <text x="110" y="80" text-anchor="middle" font-size="11" fill="#15803d">USDT P&amp;L: 0 USDT</text>
    </g>
    
    <!-- Right: Cover Debt -->
    <g transform="translate(630, 40)">
      <path d="M 110 0 L 110 -30" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowHeadRed)" />
      
      <rect width="220" height="60" class="lot-btc-debt" fill="#fff" />
      <text x="110" y="25" text-anchor="middle" class="text-qty text-btc">Cover 1.0 BTC</text>
      <text x="110" y="45" text-anchor="middle" class="text-val text-btc">Cost to Cover: 40,000 USDT</text>
    </g>
  </g>

  <!-- ===========================
       PnL CALCULATION
       =========================== -->
  <g transform="translate(300, 500)">
     <rect width="500" height="80" class="calc-box" />
     <text x="200" y="20" text-anchor="middle" class="calc-title">REALIZED P&amp;L (on Short Position)</text>
     
     <!-- Math -->
     <text x="50" y="45" class="calc-text">Opening Proceeds (Sold @): 50,000 USDT</text>
     <text x="50" y="65" class="calc-text">Closing Cost (Covered @):  40,000 USDT</text>
     
     <text x="330" y="55" font-size="20" text-anchor="small" font-weight="bold" fill="#166534">+10,000 USDT</text>
     <text x="370" y="70" font-size="10" text-anchor="small" fill="#166534">GAIN</text>
  </g>

</svg>
