<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
      
      .bg { fill: #ffffff; }
      
      .queue-track { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 2; rx: 10; }
      .queue-label { font-size: 12px; font-weight: bold; fill: #94a3b8; text-transform: uppercase; font-family: 'Inter', sans-serif; }
      
      .lot-box { stroke-width: 2; rx: 6; cursor: default; }
      .lot-a { fill: #dbeafe; stroke: #2563eb; }
      .lot-remaining { fill: #eff6ff; stroke: #60a5fa; stroke-dasharray: 4; }
      
      .lot-content-text { font-family: 'Inter', sans-serif; font-weight: bold; font-size: 16px; }
      .lot-a-text { fill: #1e40af; }
      
      .lot-cost-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.8; }
      
      .action-label { font-size: 16px; font-weight: bold; fill: #0f172a; font-family: 'Inter', sans-serif; }
      .math-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .math-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #334155; }
      .result-pos { fill: #166534; font-weight: bold; }
      
      /* Scissors / Slicing */
      .slice-line { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 6; }
      .slice-label { fill: #ef4444; font-size: 12px; font-weight: bold; font-family: 'Inter', sans-serif; }
      .annotation { fill: #64748b; font-size: 14px; font-family: 'Inter', sans-serif; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="1300" height="300" class="bg" />

  <!-- ===============================
       SCENARIO: Partial Fill
       =============================== -->
       
  <!-- BEFORE -->
  <g transform="translate(50, 40)">
    <text x="0" y="20" class="action-label" fill="#2563eb">State: One Big Lot (1.0 ETH)</text>
    
    <rect x="280" y="0" width="400" height="60" class="queue-track" />
    <text x="290" y="35" class="queue-label">IN</text>
    
    <!-- Big Lot A -->
    <g transform="translate(480, 5)">
      <rect width="200" height="50" class="lot-box lot-a" />
      <text x="100" y="22" text-anchor="middle" class="lot-content-text lot-a-text">Lot A: 1.0 ETH</text>
      <text x="100" y="40" text-anchor="middle" class="lot-content-text lot-a-text lot-cost-label">Basis: 2,000 USDT</text>
    </g>
  </g>

  <!-- ACTION: Sell 0.4 -->
  <g transform="translate(50, 160)">
    <text x="0" y="20" class="action-label">Action: Sell 0.4 ETH</text>
    <text x="0" y="45" class="annotation">Sell is smaller than Lot A.</text>
    <text x="0" y="65" class="annotation">We must SPLIT the lot.</text>
    
    <rect x="280" y="0" width="400" height="60" class="queue-track" />
    <text x="640" y="35" class="queue-label">OUT</text>
    
    <!-- The Split visual -->
    <g transform="translate(480, 5)">
      <!-- Remaining Part (0.6) -->
      <rect x="0" y="0" width="120" height="50" class="lot-box lot-a" />
      <text x="60" y="22" text-anchor="middle" class="lot-content-text lot-a-text">Lot A'</text>
      <text x="60" y="40" text-anchor="middle" class="lot-content-text lot-a-cost lot-cost-label">0.6 left</text>
      
      <!-- Consumed Part (0.4) moving out -->
      <g transform="translate(260, 0)"> 
        <path d="M -70 25 L -10 25" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowHead)" />
        
        <rect width="80" height="50" class="lot-box lot-a" opacity="0.6" stroke-dasharray="4" />
        <text x="40" y="22" text-anchor="middle" class="lot-content-text lot-a-text">0.4</text>
        <text x="40" y="40" text-anchor="middle" class="lot-content-text lot-a-text lot-cost-label">Consumed</text>
      </g>
      
      <!-- Scissors Line -->
      <line x1="160" y1="-10" x2="160" y2="60" class="slice-line" />
      <text x="160" y="-15" text-anchor="middle" class="slice-label">SLICE</text>
    </g>
    
    <!-- PnL Calculation Box -->
    <!-- Shifted further right to avoid clipping -->
     <g transform="translate(860, 0)">
       <rect x="0" y="0" width="240" height="60" class="math-box" />
       
       <text x="10" y="20" class="math-text">Sold: 0.4 ETH</text>
       <text x="10" y="35" class="math-text">Cost: 0.4 × 2,000 USDT = 800 USDT</text>
       <text x="10" y="50" class="math-text result-pos">PnL calculated on 800 USDT basis</text>
    </g>
  </g>
  
  <text x="280" y="270" class="annotation" font-style="italic">Original Lot A is effectively deleted and replaced by Lot A' (0.6 remaining).</text>

</svg>
