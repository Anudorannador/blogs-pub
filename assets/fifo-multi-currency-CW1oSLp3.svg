<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .bg { fill: #ffffff; }
      
      /* Zones */
      .zone-reality { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .zone-accounting { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1; }
      .zone-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: bold; fill: #64748b; letter-spacing: 1px; }

      /* Cards */
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
      .card-buy { stroke: #3b82f6; } /* Blue */
      .card-sell { stroke: #22c55e; } /* Green */
      
      /* Text */
      .title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; }
      .mono-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #334155; }
      .asset-text { font-weight: bold; }
      .fiat-eur { fill: #1e40af; }
      .fiat-gbp { fill: #166534; }
      .lot-usdt { fill: #b45309; }
      
      /* Arrows */
      .arrow-timeline { stroke: #94a3b8; stroke-width: 3; marker-end: url(#arrowHead); }
      .arrow-convert { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 4; marker-end: url(#arrowHeadOrange); }
      
      /* Rates */
      .rate-pill { fill: #fffbeb; stroke: #fcd34d; rx: 12; }
      .rate-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #b45309; text-anchor: middle; font-weight: bold; }

    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
    <marker id="arrowHeadOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1000" height="500" class="bg" />

  <!-- Zone: Real World (Top) -->
  <rect x="20" y="20" width="960" height="200" class="zone-reality" rx="8" />
  <text x="40" y="50" class="zone-label">REALITY (ACTUAL TOKENS SPENT/RECEIVED)</text>

  <!-- Zone: Accounting (Bottom) -->
  <rect x="20" y="240" width="960" height="240" class="zone-accounting" rx="8" />
  <text x="40" y="270" class="zone-label">ACCOUNTING (UNIFIED BASE: USDT)</text>

  <!-- ===========================
       EVENT 1: BUY with EURC
       =========================== -->
  <g transform="translate(100, 70)">
    <!-- Reality Card -->
    <rect width="260" height="100" class="card card-buy" />
    <text x="20" y="30" class="title" fill="#1e3a8a">1. Acquisition</text>
    <text x="20" y="60" class="mono-text asset-text fiat-eur">- 40,000 EURC</text>
    <text x="20" y="80" class="mono-text asset-text" fill="#0f172a">+ 1.0 BTC</text>
  </g>

  <!-- Link Down -->
  <path d="M 230 170 L 230 240" class="arrow-convert" />
  
  <!-- Rate Bubble -->
  <g transform="translate(150, 195)">
    <rect width="160" height="24" class="rate-pill" />
    <text x="80" y="16" class="rate-text">Rate: 1 EURC = 1.10 USDT</text>
  </g>

  <!-- Accounting Card 1 -->
  <g transform="translate(100, 290)">
    <rect width="260" height="100" class="card" stroke="#94a3b8" />
    <text x="20" y="30" class="title" fill="#64748b">Cost Basis Record</text>
    <text x="20" y="60" class="mono-text">Math: 40k * 1.10</text>
    <text x="20" y="85" class="mono-text asset-text lot-usdt" font-size="16">44,000 USDT</text>
  </g>


  <!-- TIMELINE ARROW (BTC Holding) -->
  <path d="M 380 120 L 580 120" class="arrow-timeline" />
  <text x="480" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8" font-weight="bold">HOLDING 1 BTC</text>


  <!-- ===========================
       EVENT 2: SELL for JPYC
       =========================== -->
  <g transform="translate(600, 70)">
    <!-- Reality Card -->
    <rect width="260" height="100" class="card card-sell" />
    <text x="20" y="30" class="title" fill="#14532d">2. Disposal</text>
    <text x="20" y="60" class="mono-text asset-text" fill="#0f172a">- 1.0 BTC</text>
    <text x="20" y="80" class="mono-text asset-text fiat-gbp">+ 7,800,000 JPYC</text>
  </g>

  <!-- Link Down -->
  <path d="M 730 170 L 730 240" class="arrow-convert" />

  <!-- Rate Bubble -->
  <g transform="translate(650, 195)">
    <rect width="160" height="24" class="rate-pill" />
    <text x="80" y="16" class="rate-text">Rate: 1 JPYC = 0.007 USDT</text>
  </g>

  <!-- Accounting Card 2 -->
  <g transform="translate(600, 290)">
    <rect width="260" height="100" class="card" stroke="#94a3b8" />
    <text x="20" y="30" class="title" fill="#64748b">Proceeds Record</text>
    <text x="20" y="60" class="mono-text">Math: 7.8M * 0.007</text>
    <text x="20" y="85" class="mono-text asset-text lot-usdt" font-size="16">54,600 USDT</text>
  </g>

  <!-- ===========================
       RESULT
       =========================== -->
  <g transform="translate(380, 420)">
     <line x1="0" y1="20" x2="200" y2="20" stroke="#cbd5e1" stroke-width="2" />
     <text x="100" y="10" text-anchor="middle" class="mono-text" fill="#64748b">P&amp;L (Proceeds - Cost)</text>
     <text x="100" y="45" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="20" fill="#16a34a">+10,600 USDT</text>
  </g>

</svg>
