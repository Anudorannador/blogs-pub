<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      
      .queue-track { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 2; rx: 10; }
      .queue-label { font-size: 11px; font-weight: bold; fill: #94a3b8; text-transform: uppercase; font-family: 'Inter', sans-serif; }
      
      .lot-box { stroke-width: 2; rx: 6; cursor: default; }
      
      /* Asset Colors */
      .lot-btc { fill: #ffedd5; stroke: #ea580c; }  /* Orange */
      .lot-uni { fill: #fce7f3; stroke: #db2777; }  /* Pink/Magenta for UNI */
      
      .text-bold { font-family: 'Inter', sans-serif; font-weight: bold; font-size: 14px; }
      .text-addr { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.8; }
      .color-btc { fill: #9a3412; }
      .color-uni { fill: #831843; }
      
      .step-title { font-size: 16px; font-weight: bold; fill: #1e293b; font-family: 'Inter', sans-serif; }
      .step-desc { font-size: 13px; fill: #64748b; font-family: 'Inter', sans-serif; }
      
      .arrow-carry { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4; marker-end: url(#arrowHead); fill: none; }
      .basis-tag { font-size: 11px; font-weight: bold; fill: #fff; text-anchor: middle; }
      .basis-bg { fill: #64748b; rx: 4; }
      
      .pnl-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .pnl-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #334155; }
      
      .carry-path { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowHeadBlue); }
      .carry-box { fill: #ffffff; stroke: #64748b; rx: 4; }
      .carry-text { font-size: 12px; font-weight: bold; fill: #64748b; text-anchor: middle; font-family: 'Inter', sans-serif; }
      
      .action-tag { font-size: 10px; font-weight: bold; text-transform: uppercase; font-family: 'Inter', sans-serif; }
      
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e1" />
    </marker>
    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1200" height="600" class="bg" />

  <!-- Title -->
  <text x="50" y="40" font-size="20" font-weight="bold" font-family="sans-serif" fill="#0f172a">Chain: USDT → BTC → UNI → USDT</text>

  <!-- ===============================
       STEP 1: Buy BTC with USDT
       =============================== -->
  <g transform="translate(50, 80)">
    <text x="0" y="20" class="step-title">1. Buy (Acquire) 0.02 BTC with 1,000 USDT</text>
    <text x="0" y="40" class="step-desc">Cost Basis established at 1,000 USDT.</text>
    
    <rect x="450" y="0" width="300" height="60" class="queue-track" />
    <text x="460" y="35" class="queue-label">BTC Queue</text>
    
    <!-- Lot: BTC Entering -->
    <g transform="translate(600, 5)">
      <rect width="140" height="50" class="lot-box lot-btc" />
      <text x="70" y="20" text-anchor="middle" class="text-bold color-btc">0.02 BTC</text>
      
      <!-- Basis Tag -->
      <rect x="30" y="30" width="80" height="16" class="basis-bg" />
      <text x="70" y="42" class="basis-tag">Basis: 1k USDT</text>
    </g>
  </g>

  <!-- ===============================
       STEP 2: Swap BTC to UNI
       =============================== -->
  <g transform="translate(50, 180)">
    <text x="0" y="20" class="step-title">2. Swap 0.02 BTC → 200 UNI</text>
    <text x="0" y="40" class="step-desc">Crypto-to-Crypto. Basis Carries Forward.</text>
    
    <!-- Row A: BTC OUT -->
    <rect x="450" y="0" width="300" height="60" class="queue-track" />
    <text x="460" y="35" class="queue-label">BTC Queue</text>
    
    <!-- Consumed BTC moving out -->
    <g transform="translate(770, 5)">
       <path d="M -70 25 L -10 25" class="arrow-carry" />
       <rect width="140" height="50" class="lot-box lot-btc" opacity="0.5" stroke-dasharray="4" />
       <text x="70" y="30" text-anchor="middle" class="text-bold color-btc">0.02 BTC</text>
    </g>
    
    <!-- Carry Path Visualization -->
    <!-- Curve: Start (920,30) -> End (630, 160) -->
    <path d="M 920 30 C 1000 30, 1000 160, 630 160" class="carry-path" />
    
    <!-- Carry Box -->
    <rect x="670" y="90" width="140" height="30" class="carry-box" />
    <text x="740" y="110" class="carry-text">CARRY BASIS (1k)</text>

    <!-- Row B: UNI IN -->
    <g transform="translate(0, 160)">
      <rect x="450" y="0" width="300" height="60" class="queue-track" />
      <text x="460" y="35" class="queue-label">UNI Queue</text>
      
      <!-- New Lot: UNI -->
      <g transform="translate(600, 5)">
        <rect width="140" height="50" class="lot-box lot-uni" />
        <text x="70" y="20" text-anchor="middle" class="text-bold color-uni">200 UNI</text>
        
        <!-- Basis Tag -->
        <rect x="30" y="30" width="80" height="16" class="basis-bg" />
        <text x="70" y="42" class="basis-tag">Basis: 1k USDT</text>
      </g>
    </g>
    
    <!-- PnL Status -->
     <g transform="translate(950, 40)">
       <text x="0" y="20" font-weight="bold" fill="#64748b">UNREALIZED</text>
       <text x="0" y="40" font-size="12" fill="#94a3b8">(Token to Token)</text>
    </g>
  </g>

  <!-- ===============================
       STEP 3: Sell UNI to USDT
       =============================== -->
  <!-- Previous group Y=180 + 160 + 60 = 400. Add buffer -> Y=460 -->
  <g transform="translate(50, 460)">
    <text x="0" y="20" class="step-title">3. Sell 200 UNI → 1,500 USDT</text>
    <text x="0" y="40" class="step-desc">Settlement to Stablecoin (Cash). Realize P&amp;L.</text>

    <!-- Row A: UNI OUT -->
    <rect x="450" y="0" width="300" height="60" class="queue-track" />
    <text x="460" y="35" class="queue-label">UNI Queue</text>
    
    <!-- Consumed UNI -->
    <g transform="translate(770, 5)">
       <path d="M -70 25 L -10 25" class="arrow-carry" />
       <rect width="140" height="50" class="lot-box lot-uni" opacity="0.5" stroke-dasharray="4" />
       <text x="70" y="30" text-anchor="middle" class="text-bold color-uni">200 UNI</text>
    </g>
    
    <!-- PnL Calculation -->
    <g transform="translate(950, 0)">
       <rect x="0" y="0" width="180" height="80" class="pnl-box" />
       <text x="10" y="20" class="pnl-text">Proceeds: 1,500 USDT</text>
       <text x="10" y="35" class="pnl-text">Basis:    1,000 USDT</text>
       <line x1="10" y1="45" x2="170" y2="45" stroke="#cbd5e1" stroke-width="1" />
       <text x="10" y="65" class="pnl-text" font-weight="bold" fill="#166534">Realized: +500 USDT</text>
    </g>
  </g>

</svg>
