<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
      
      .bg { fill: #ffffff; }
      
      .queue-track { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 2; rx: 10; }
      .queue-label { font-size: 11px; font-weight: bold; fill: #94a3b8; text-transform: uppercase; font-family: 'Inter', sans-serif; }
      
      .lot-box { stroke-width: 2; rx: 6; cursor: default; }
      
      /* Asset Colors */
      .lot-usdt { fill: #d1fae5; stroke: #059669; } /* Green */
      .lot-btc { fill: #ffedd5; stroke: #ea580c; }  /* Orange */
      
      .text-bold { font-family: 'Inter', sans-serif; font-weight: bold; font-size: 14px; }
      .text-addr { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.8; }
      .color-usdt { fill: #065f46; }
      .color-btc { fill: #9a3412; }
      
      .step-title { font-size: 16px; font-weight: bold; fill: #1e293b; font-family: 'Inter', sans-serif; }
      .step-desc { font-size: 13px; fill: #64748b; font-family: 'Inter', sans-serif; }
      
      .arrow-carry { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4; marker-end: url(#arrowHead); fill: none; }
      .basis-tag { font-size: 11px; font-weight: bold; fill: #fff; text-anchor: middle; }
      .basis-bg { fill: #64748b; rx: 4; }
      
      .pnl-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .pnl-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #334155; }
      
      .carry-path { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowHeadBlue); }
      .carry-box { fill: #ffffff; stroke: #64748b; rx: 4; }
      .carry-text { font-size: 12px; font-weight: bold; fill: #64748b; text-anchor: middle; font-family: 'Inter', sans-serif; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e1" />
    </marker>
    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1000" height="900" class="bg" />

  <!-- Title -->
  <text x="50" y="40" font-size="20" font-weight="bold" font-family="sans-serif" fill="#0f172a">Basis Carry Forward: USD to USDT to BTC to USDT to USD</text>

  <!-- ===============================
       STEP 1: Buy USDT with USD
       =============================== -->
  <g transform="translate(50, 80)">
    <text x="0" y="20" class="step-title">1. Buy 1,000 USDT with $1,000 USD</text>
    <text x="0" y="40" class="step-desc">Acquisition. Basis established in USD.</text>
    
    <rect x="300" y="0" width="300" height="60" class="queue-track" />
    <text x="310" y="35" class="queue-label">USDT Queue</text>
    
    <!-- Lot: USDT -->
    <g transform="translate(450, 5)">
      <rect width="140" height="50" class="lot-box lot-usdt" />
      <text x="70" y="20" text-anchor="middle" class="text-bold color-usdt">1,000 USDT</text>
      
      <!-- Basis Tag -->
      <rect x="30" y="30" width="80" height="16" class="basis-bg" />
      <text x="70" y="42" class="basis-tag">Basis: $1,000</text>
    </g>
  </g>

  <!-- ===============================
       STEP 2: Swap USDT to BTC
       =============================== -->
  <!-- Increased spacing: Y=200 -->
  <g transform="translate(50, 200)">
    <text x="0" y="20" class="step-title">2. Swap 1,000 USDT to 0.02 BTC</text>
    <text x="0" y="40" class="step-desc">Non-fiat exchange.</text>
    
    <!-- Row A: USDT OUT -->
    <rect x="300" y="0" width="300" height="60" class="queue-track" />
    <text x="310" y="35" class="queue-label">USDT Queue</text>
    
    <!-- Consumed USDT moving out -->
    <g transform="translate(620, 5)">
       <path d="M -70 25 L -10 25" class="arrow-carry" />
       <rect width="140" height="50" class="lot-box lot-usdt" opacity="0.5" stroke-dasharray="4" />
       <text x="70" y="30" text-anchor="middle" class="text-bold color-usdt">1,000 USDT</text>
    </g>
    
    <!-- Carry Path Visualization - now explicitly between the two tracks -->
    <!-- Start at end of USDT lot (x=770, y=30), curve down to start of BTC lot -->
    <path d="M 770 30 C 850 30, 850 160, 480 160" class="carry-path" />
    
    <!-- Carry Box in the middle of the vertical gap -->
    <rect x="520" y="90" width="140" height="30" class="carry-box" />
    <text x="590" y="110" class="carry-text">CARRY BASIS ($1k)</text>

    <!-- Row B: BTC IN (Shifted down by 160px from top of this group) -->
    <g transform="translate(0, 160)">
      <rect x="300" y="0" width="300" height="60" class="queue-track" />
      <text x="310" y="35" class="queue-label">BTC Queue</text>
      
      <!-- New Lot: BTC -->
      <!-- Entering at the front (shifted to x=450 to be at the rightmost end of the queue) -->
      <g transform="translate(450, 5)">
        <rect width="140" height="50" class="lot-box lot-btc" />
        <text x="70" y="20" text-anchor="middle" class="text-bold color-btc">0.02 BTC</text>
        
        <!-- Basis Tag -->
        <rect x="30" y="30" width="80" height="16" class="basis-bg" />
        <text x="70" y="42" class="basis-tag">Basis: $1,000</text>
      </g>
    </g>
    
    <!-- PnL Status -->
     <g transform="translate(800, 40)">
       <text x="0" y="20" font-weight="bold" fill="#64748b">No Realized PnL!</text>
       <text x="0" y="40" font-size="12" fill="#94a3b8">(Token to Token)</text>
    </g>
  </g>

  <!-- ===============================
       STEP 3: Swap BTC to USDT
       =============================== -->
  <!-- Previous group ends at Y=200+160+60 = 420. Add buffer -> Y=460 -->
  <g transform="translate(50, 460)">
    <text x="0" y="20" class="step-title">3. Swap 0.02 BTC to 1,200 USDT</text>
    <text x="0" y="40" class="step-desc">Basis CARRIES OVER again.</text>

    <!-- Row A: BTC OUT -->
    <rect x="300" y="0" width="300" height="60" class="queue-track" />
    <text x="310" y="35" class="queue-label">BTC Queue</text>
    
    <!-- Consumed BTC -->
    <g transform="translate(620, 5)">
       <path d="M -70 25 L -10 25" class="arrow-carry" />
       <rect width="140" height="50" class="lot-box lot-btc" opacity="0.5" stroke-dasharray="4" />
       <text x="70" y="30" text-anchor="middle" class="text-bold color-btc">0.02 BTC</text>
    </g>
    
    <!-- Carry Path -->
    <path d="M 770 30 C 850 30, 850 160, 480 160" class="carry-path" />
    
    <rect x="520" y="90" width="140" height="30" class="carry-box" />
    <text x="590" y="110" class="carry-text">CARRY BASIS ($1k)</text>

    <!-- Row B: USDT IN (Shifted down 160px) -->
    <g transform="translate(0, 160)">
        <rect x="300" y="0" width="300" height="60" class="queue-track" />
        <text x="310" y="35" class="queue-label">USDT Queue</text>
        
        <!-- New Lot: USDT -->
        <!-- Entering at the front (shifted to x=450 to be at the rightmost end of the queue) -->
        <g transform="translate(450, 5)">
            <rect width="140" height="50" class="lot-box lot-usdt" />
            <text x="70" y="20" text-anchor="middle" class="text-bold color-usdt">1,200 USDT</text>
            
            <!-- Basis Tag -->
            <rect x="30" y="30" width="80" height="16" class="basis-bg" />
            <text x="70" y="42" class="basis-tag">Basis: $1,000</text>
        </g>
    </g>
     
     <g transform="translate(800, 40)">
       <text x="0" y="20" font-weight="bold" fill="#64748b">Still No Realized PnL</text>
    </g>
  </g>

  <!-- ===============================
       STEP 4: Sell USDT to USD
       =============================== -->
  <!-- Previous group ends at Y=460+160+60 = 680. Add buffer -> Y=740 -->
  <g transform="translate(50, 740)">
    <text x="0" y="20" class="step-title">4. Sell 1,200 USDT to $1,200 USD (Fiat)</text>
    <text x="0" y="40" class="step-desc">Settlement! This triggers Realized PnL.</text>
    
    <rect x="300" y="0" width="300" height="60" class="queue-track" />
    <text x="310" y="35" class="queue-label">USDT Queue</text>
    
    <!-- Consumed -->
    <g transform="translate(620, 5)">
       <path d="M -70 25 L -10 25" class="arrow-carry" />
       
       <rect width="140" height="50" class="lot-box lot-usdt" opacity="0.5" stroke-dasharray="4" />
       <text x="70" y="30" text-anchor="middle" class="text-bold color-usdt">1,200 USDT</text>
    </g>
    
    <!-- PnL Calculation -->
    <g transform="translate(800, 0)">
       <rect x="0" y="0" width="180" height="60" class="pnl-box" />
       <text x="10" y="20" class="pnl-text">Proceeds: $1,200</text>
       <text x="10" y="35" class="pnl-text">Basis:    $1,000</text>
       <text x="10" y="50" class="pnl-text" font-weight="bold" fill="#166534">Realized: +$200</text>
    </g>
  </g>

</svg>
